[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vn30-candlestick-radar"
version = "0.1.0"
description = "Radar mẫu hình nến VN30: phát hiện, cảnh báo sớm và kiểm định thống kê (dữ liệu SSI FastConnect)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<3",
    "pandas>=2.0,<4",
    "requests>=2.31,<3",
    "python-dotenv>=1.0,<2",
    "scipy>=1.11,<2",
    "plotly>=5.18,<7",
    "streamlit>=1.51,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<10"]
screenshots = ["playwright>=1.48,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data = ["universe_vn30.txt"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
